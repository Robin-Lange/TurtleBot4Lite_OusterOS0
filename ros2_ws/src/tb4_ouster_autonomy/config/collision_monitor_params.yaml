collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_safe"
    cmd_vel_out_topic: "/cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: True
    stop_pub_timeout: 1.0

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      points: "[[0.26, 0.24], [0.26, -0.24], [-0.24, -0.24], [-0.24, 0.24]]"
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    PolygonSlow:
      type: "polygon"
      points: "[[0.45, 0.35], [0.45, -0.35], [-0.30, -0.35], [-0.30, 0.35]]"
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.4
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    observation_sources: ["pointcloud"]

    pointcloud:
      type: "pointcloud"
      topic: "/ouster/cloud_filtered"
      min_height: 0.04
      max_height: 0.25
      enabled: True
