collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_safe
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 1.0
    source_timeout: 2.0
    base_shift_correction: false
    stop_pub_timeout: 1.0
    polygons:
    - PolygonStop
    - PolygonSlow
    PolygonStop:
      type: polygon
      points:
      - 0.26
      - 0.24
      - 0.26
      - -0.24
      - -0.24
      - -0.24
      - -0.24
      - 0.24
      action_type: stop
      max_points: 0
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points:
      - 0.45
      - 0.35
      - 0.45
      - -0.35
      - -0.3
      - -0.35
      - -0.3
      - 0.35
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.4
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
    observation_sources:
    - scan
    - pointcloud
    pointcloud:
      type: pointcloud
      topic: /camera/cloud_filtered
      min_height: 0.04
      max_height: 1.5
      enabled: true
    scan:
      type: scan
      topic: /scan
