name: CI

# Feature branches are checked through PRs; integration branches also run after merges.
# Avoid path filters here so a required CI check cannot remain pending on docs-only PRs.
on:
  push:
    branches: [main, feature/realsense-rplidar-navigation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ROS_DOMAIN_ID: "88"
  ROS_LOCALHOST_ONLY: "1"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Code Quality and Linting
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10 and pip cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install pinned CI tools
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Validate workflows and shell scripts
        run: |
          bash scripts/ci/check_workflows.sh
          shellcheck --severity=warning --exclude=SC1090,SC1091 setup_env.sh scripts/*.sh scripts/ci/*.sh

      - name: Lint and compile Python
        run: |
          python -m flake8 --config .flake8 ros2_ws/src/ scripts/ci/
          python -m compileall -q ros2_ws/src/ scripts/

      - name: Run pure systems and configuration tests
        run: |
          python -m pytest -q \
            ros2_ws/src/tb4_ouster_autonomy/test/test_systems.py \
            ros2_ws/src/tb4_ouster_autonomy/test/test_visibility.py \
            ros2_ws/src/tb4_ouster_autonomy/test/test_configuration.py \
            ros2_ws/src/tb4_ouster_autonomy/test/test_autonomous_explorer.py \
            scripts/ci/test_report_tests.py \
            --junitxml=test-results/pure.xml

      - name: Report pure test results
        if: ${{ always() }}
        run: python scripts/ci/report_tests.py test-results/pure.xml --label "Pure systems and configuration"

      - name: Retain pure test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  build-and-test:
    name: ROS 2 Humble Build & Test (${{ matrix.arch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container:
      image: ros:humble-ros-base-jammy
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DISTRO: humble
      TEST_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared system and ROS dependencies
        run: |
          mkdir -p test-results
          apt-get update 2>&1 | tee test-results/apt-update.log
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-pytest \
            2>&1 | tee test-results/build-dependencies.log
          rosdep update --rosdistro humble 2>&1 | tee test-results/rosdep-update.log
          rosdep install --from-paths ros2_ws/src --ignore-src -y --rosdistro humble \
            2>&1 | tee test-results/rosdep-install.log

      - name: Record architecture and installed versions
        run: |
          {
            uname -m
            python3 --version
            dpkg-query -W 'ros-humble-*' python3-numpy
          } > test-results/environment.txt
          test "$(dpkg --print-architecture)" = "$TEST_ARCH"

      - name: Build workspace
        run: |
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          cd ros2_ws
          colcon build --symlink-install --event-handlers console_direct+ \
            2>&1 | tee ../test-results/colcon-build.log

      - name: Run all ROS tests in an isolated domain
        run: |
          set +u
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/local_setup.bash
          set -u
          cd ros2_ws
          PYTHONNOUSERSITE=1 colcon test --packages-select tb4_ouster_autonomy \
            --event-handlers console_direct+ --return-code-on-test-failure \
            2>&1 | tee ../test-results/colcon-test.log

      - name: Check and summarize ROS test results
        if: ${{ always() }}
        run: |
          python3 scripts/ci/report_tests.py \
            ros2_ws/build/tb4_ouster_autonomy/pytest.xml --label "ROS 2 Humble ($TEST_ARCH)"

      - name: Retain ROS test results and build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ros-humble-results-${{ matrix.arch }}
          path: |
            test-results/
            ros2_ws/build/tb4_ouster_autonomy/pytest.xml
            ros2_ws/log/
          retention-days: 14
          if-no-files-found: warn

  ci:
    name: CI required
    if: ${{ always() }}
    needs: [quality, build-and-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      ROS_RESULT: ${{ needs.build-and-test.result }}
    steps:
      - name: Require every job to succeed
        run: |
          printf 'Quality: %s\nROS matrix: %s\n' "$QUALITY_RESULT" "$ROS_RESULT"
          test "$QUALITY_RESULT" = success
          test "$ROS_RESULT" = success
